name: Build executables

# PyInstaller can't cross-compile, so each binary is built on its own native
# runner. Produces macOS, Linux and Windows executables as workflow artifacts,
# and attaches them to a GitHub Release when you push a v* tag.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write  # needed to attach binaries to a Release on tag builds

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            binname: TRC_Tally_Cloud_Client
            archive: TRC_Tally_Cloud_Client-macos.tar.gz
          - os: ubuntu-latest
            binname: TRC_Tally_Cloud_Client
            archive: TRC_Tally_Cloud_Client-linux.tar.gz
          - os: windows-latest
            binname: TRC_Tally_Cloud_Client.exe
            archive: TRC_Tally_Cloud_Client-windows.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build
        run: pyinstaller --clean -y TRC_Tally_Cloud_Client.spec

      # Package into an archive so the executable bit survives download. tar
      # records file modes (no chmod needed on extract); Windows uses a zip.
      - name: Package
        shell: bash
        working-directory: dist
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "../${{ matrix.archive }}" "${{ matrix.binname }}"
          else
            chmod +x "${{ matrix.binname }}"
            tar -czf "../${{ matrix.archive }}" "${{ matrix.binname }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive }}
